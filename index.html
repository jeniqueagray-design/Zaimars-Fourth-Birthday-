<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zaimars Turns Four 🎉</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Comic Sans MS', Arial, sans-serif;
    background: url('Dinosaur%20and%20unicorn%20birthday%20party.png') no-repeat center center fixed;
    background-size: cover;
    text-align: center;
  }

  h1 {
    margin-top: 20px;
    font-size: 3em;
    text-shadow: 2px 2px 5px #000;
  }

  p {
    font-size: 1.5em;
    color: black; /* tagline in black */
    text-shadow: 1px 1px 0 #fff;
  }

  #camera-container {
    position: relative;
    display: inline-block;
    margin-top: 20px;
    width: 340px;
    height: 260px;
    overflow: hidden;
    border-radius: 25px;
    background: rgba(255,255,255,0.1);
  }

  #camera-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #gallery {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }

  #gallery img {
    width: 150px;
    margin: 5px;
    border: 3px solid #fff;
    border-radius: 10px;
    box-shadow: 2px 2px 5px #000;
  }

  button {
    margin: 10px;
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(45deg, #ff69b4, #ffb6c1);
    border: none;
    color: white;
    font-weight: bold;
    box-shadow: 2px 2px 5px #000;
    transition: transform 0.1s ease;
  }

  button:hover {
    transform: scale(1.05);
  }

  button:disabled {
    background-color: #888;
    cursor: not-allowed;
  }

</style>
</head>
<body>

<h1>🎉 Zaimars Turns Four 🎉</h1>
<p>Roar • Sparkle • Shine</p>

<div id="camera-container">
  <video id="video" autoplay playsinline></video>
</div>

<br>
<button id="start">Start Camera</button>
<button id="toggle" disabled>Switch Camera</but
