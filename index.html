<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zaimars Turns Four 🎉</title>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Comic Sans MS', Arial, sans-serif;
  background: url('Dinosaur%20and%20unicorn%20birthday%20party.png') no-repeat center center fixed;
  background-size: cover;
  text-align: center;
}

/* Title */
h1 {
  margin-top: 20px;
  font-size: 3em;
  color: black;
  text-shadow: 2px 2px 4px #fff;
}

p {
  font-size: 1.5em;
  text-shadow: 1px 1px 0 #000;
}

/* Camera container */
#camera-container {
  position: relative;
  display: inline-block;
  margin-top: 20px;

  width: 90vw;
  max-width: 520px;
  aspect-ratio: 4 / 3;

  overflow: hidden;
  border-radius: 25px;
  background: rgba(255,255,255,0.1);
}

#camera-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Border overlay */
#border-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 10;
}

/* Buttons */
button {
  margin: 10px;
  padding: 10px 22px;
  font-size: 18px;
  border-radius: 12px;
  cursor: pointer;
  background: linear-gradient(45deg, #ff69b4, #ffb6c1);
  border: none;
  color: white;
  font-weight: bold;
  box-shadow: 2px 2px 5px #000;
}

button:disabled {
  background: #888;
  cursor: not-allowed;
}

/* Links */
.gallery-link,
#view-gallery {
  display: block;
  margin-top: 12px;
  font-size: 1.2em;
  color: black;
  text-decoration: underline;
}
</style>
</head>

<body>

<h1>🎉 Zaimars Turns Four 🎉</h1>
<p>Roar • Sparkle • Shine</p>

<div id="camera-container">
  <video id="video" autoplay playsinline></video>
  <img
    id="border-overlay"
    src="https://lbemcrfivrhbhseafrlc.supabase.co/storage/v1/object/public/Party%20Photos/Border%20Flyer.png"
    alt="Border Overlay"
  />
</div>

<br>

<button id="start">Start Camera</button>
<button id="toggle" disabled>Switch Camera</button>
<button id="snap" disabled>Take Photo</button>

<div id="latest-photo-link"></div>

<a
  id="view-gallery"
  href="https://drive.google.com/drive/folders/1NVzPpcGULNBn3ytPbDzFAFmCUn28G1HQ?usp=drive_link"
  target="_blank"
>
  View Gallery
</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {

  const supabase = window.supabase.createClient(
    "https://lbemcrfivrhbhseafrlc.supabase.co",
    "sb_publishable_ey_VaVfrz5YwZIxTHcHcaA_pSY5W8-R"
  );

  const video = document.getElementById("video");
  const startBtn = document.getElementById("start");
  const toggleBtn = document.getElementById("toggle");
  const snapBtn = document.getElementById("snap");
  const latestLinkDiv = document.getElementById("latest-photo-link");

  let stream = null;
  let cameras = [];
  let cameraIndex = 0;

  async function getCameras() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    cameras = devices.filter(d => d.kind === "videoinput");
    toggleBtn.disabled = cameras.length < 2;
  }

  async function startCamera(deviceId) {
    if (stream) stream.getTracks().forEach(t => t.stop());

    stream = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? { deviceId: { exact: deviceId } } : true
    });

    video.srcObject = stream;

    await new Promise(r => video.onloadedmetadata = r);
    snapBtn.disabled = false;
  }

  startBtn.onclick = async () => {
    await navigator.mediaDevices.getUserMedia({ video: true });
    await getCameras();
    cameraIndex = 0;
    startCamera(cameras[cameraIndex]?.deviceId);
  };

  toggleBtn.onclick = () => {
    cameraIndex = (cameraIndex + 1) % cameras.length;
    startCamera(cameras[cameraIndex].deviceId);
  };

  snapBtn.onclick = async () => {
    if (!video.videoWidth) return alert("Camera not ready");

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    const border = new Image();
    border.crossOrigin = "anonymous";
    border.src = document.getElementById("border-overlay").src;

    border.onload = async () => {
      ctx.drawImage(border, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async blob => {
        const fileName = `Zaimar_${Date.now()}.png`;

        await supabase.storage
          .from("Party Photos")
          .upload(fileName, blob, { contentType: "image/png" });

        const { data } = supabase.storage
          .from("Party Photos")
          .getPublicUrl(fileName);

        latestLinkDiv.innerHTML = `
          <a class="gallery-link" href="${data.publicUrl}" target="_blank">
            View Last Uploaded Photo
          </a>
        `;

        alert("Photo uploaded! 🎉");
      });
    };
  };
});
</script>

</body>
</html>
