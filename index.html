<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zaimars Turns Four 🎉</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Comic Sans MS', Arial, sans-serif;
  background: url('Dinosaur%20and%20unicorn%20birthday%20party.png') no-repeat center center fixed;
  background-size: cover;
  text-align: center;
  color: white;
}

h1 {
  margin-top: 20px;
  font-size: 3em;
  text-shadow: 2px 2px 5px #000;
}

p {
  font-size: 1.5em;
  text-shadow: 1px 1px 0 #000;
}

#camera-container {
  position: relative;
  display: inline-block;
  margin-top: 20px;
  width: 340px;
  height: 260px;
  overflow: hidden;
  border-radius: 25px;
  background: rgba(255,255,255,0.1);
}

#camera-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#border-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 10;
}

button {
  margin: 10px;
  padding: 10px 20px;
  font-size: 18px;
  border-radius: 12px;
  cursor: pointer;
  background: linear-gradient(45deg, #ff69b4, #ffb6c1);
  border: none;
  color: white;
  font-weight: bold;
  box-shadow: 2px 2px 5px #000;
  transition: transform 0.1s ease;
}

button:hover {
  transform: scale(1.05);
}

button:disabled {
  background-color: #888;
  cursor: not-allowed;
}

.gallery-link {
  display: block;
  margin-top: 15px;
  font-size: 1.2em;
  color: #fff;
  text-decoration: underline;
}
</style>
</head>
<body>

<h1>🎉 Zaimars Turns Four 🎉</h1>
<p>Roar • Sparkle • Shine</p>

<div id="camera-container">
  <video id="video" autoplay playsinline></video>
  <!-- Live border overlay -->
  <img id="border-overlay" src="https://lbemcrfivrhbhseafrlc.supabase.co/storage/v1/object/public/Party%20Photos/Border%20Flyer.png?v=1" alt="Border Overlay">
</div>

<br />
<button id="start">Start Camera</button>
<button id="toggle" disabled>Switch Camera</button>
<button id="snap" disabled>Take Photo</button>

<div id="latest-photo-link"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {

  const supabaseUrl = "https://lbemcrfivrhbhseafrlc.supabase.co";
  const supabaseKey = "sb_publishable_ey_VaVfrz5YwZIxTHcHcaA_pSY5W8-R";
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  const video = document.getElementById("video");
  const startBtn = document.getElementById("start");
  const toggleBtn = document.getElementById("toggle");
  const snapBtn = document.getElementById("snap");
  const latestLinkDiv = document.getElementById("latest-photo-link");

  let currentStream = null;
  let devices = [];
  let currentIndex = 0;

  // Enumerate all cameras
  async function getCameras() {
    try {
      const allDevices = await navigator.mediaDevices.enumerateDevices();
      devices = allDevices.filter(d => d.kind === "videoinput");
      toggleBtn.disabled = devices.length < 2;
    } catch (err) {
      console.error("Device enumeration error:", err);
    }
  }

  // Start camera
  async function startCamera(deviceId) {
    try {
      if (currentStream) currentStream.getTracks().forEach(track => track.stop());

      const constraints = deviceId
        ? { video: { deviceId: { exact: deviceId } } }
        : { video: { facingMode: { ideal: "environment" } } };

      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;

      // Wait until video is ready
      await new Promise(resolve => {
        if (video.readyState >= 2) resolve();
        else video.onloadedmetadata = resolve;
      });

      snapBtn.disabled = false;

    } catch (err) {
      console.error("Camera error:", err);
      alert("Cannot access camera. Make sure permissions are allowed and page is HTTPS.");
    }
  }

  // Start button
  startBtn.onclick = async () => {
    try {
      // Ask for camera permission first
      await navigator.mediaDevices.getUserMedia({ video: true });
    } catch {
      return alert("Camera permission denied.");
    }

    await getCameras();
    if (devices.length === 0) return alert("No cameras found.");
    currentIndex = 0;
    await startCamera(devices[currentIndex].deviceId);
  };

  // Toggle camera
  toggleBtn.onclick = async () => {
    if (devices.length < 2) return;
    currentIndex = (currentIndex + 1) % devices.length;
    await startCamera(devices[currentIndex].deviceId);
  };

  // Snap button
  snapBtn.onclick = async () => {
    if (!video.srcObject || video.readyState < 2) return alert("Camera not ready");

    const canvas = document.createElement("canvas");
    // Use video resolution for full quality
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");

    // Draw video
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Draw border
    const borderImg = new Image();
    borderImg.crossOrigin = "anonymous";
    borderImg.src = "https://lbemcrfivrhbhseafrlc.supabase.co/storage/v1/object/public/Party%20Photos/Border%20Flyer.png?v=1";

    borderImg.onload = async () => {
      ctx.drawImage(borderImg, 0, 0, canvas.width, canvas.height);

      // Upload to Supabase
      canvas.toBlob(async (blob) => {
        if (!blob) return alert("Capture failed.");

        const fileName = `Zaimar_${Date.now()}.png`;

        const { error } = await supabaseClient.storage
          .from("Party Photos")
          .upload(fileName, blob, { contentType: "image/png", upsert: true });

        if (error) {
          console.error(error);
          return alert(error.message);
        }

        const { data } = supabaseClient.storage
          .from("Party Photos")
          .getPublicUrl(fileName);

        latestLinkDiv.innerHTML = `<a class="gallery-link" href="${data.publicUrl}" target="_blank">
          View Last Uploaded Photo
        </a>`;

        alert("Photo uploaded! 🎉");
      }, "image/png");
    };
  };
});
</script>
</body>
</html>
