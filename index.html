<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zaimars Turns Four 🎉</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Comic Sans MS', Arial, sans-serif;
    background: url('Dinosaur%20and%20unicorn%20birthday%20party.png') no-repeat center center fixed;
    background-size: cover;
    text-align: center;
  }

  h1 {
    margin-top: 20px;
    font-size: 3em;
    text-shadow: 2px 2px 5px #000;
  }

  p {
    font-size: 1.5em;
    color: black; /* tagline in black */
    text-shadow: 1px 1px 0 #fff;
  }

  #camera-container {
    position: relative;
    display: inline-block;
    margin-top: 20px;
    width: 340px; /* display width */
    height: 260px; /* display height */
    overflow: hidden;
    border-radius: 25px;
    background: rgba(255,255,255,0.1);
  }

  #camera-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #qr-code {
    margin-top: 20px;
  }

  button {
    margin: 10px;
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(45deg, #ff69b4, #ffb6c1);
    border: none;
    color: white;
    font-weight: bold;
    box-shadow: 2px 2px 5px #000;
    transition: transform 0.1s ease;
  }

  button:hover {
    transform: scale(1.05);
  }

  button:disabled {
    background-color: #888;
    cursor: not-allowed;
  }

</style>
</head>
<body>

<h1>🎉 Zaimars Turns Four 🎉</h1>
<p>Roar • Sparkle • Shine</p>

<div id="camera-container">
  <video id="video" autoplay playsinline></video>
</div>

<br>
<button id="start">Start Camera</button>
<button id="toggle" disabled>Switch Camera</button>
<button id="snap">Take Photo</button>

<!-- Optional: QR code to upload photos to Google Form -->
<div id="qr-code">
  <p>Scan this QR code to upload your photo to the gallery:</p>
  <img src="YOUR_QR_CODE.png" alt="Scan QR code" width="200">
</div>

<!-- Optional: link to gallery -->
<h2>Party Gallery</h2>
<p><a href="YOUR_SHARED_DRIVE_FOLDER_LINK" target="_blank">View all photos here!</a></p>

<script>
const video = document.getElementById("video");
const startBtn = document.getElementById("start");
const toggleBtn = document.getElementById("toggle");
const snapBtn = document.getElementById("snap");

let currentStream = null;
let devices = [];
let currentIndex = 0;

// Get all cameras
async function getCameras() {
  const allDevices = await navigator.mediaDevices.enumerateDevices();
  devices = allDevices.filter(d => d.kind === "videoinput");
  if (devices.length > 1) toggleBtn.disabled = false;
}

// Start camera
async function startCamera(deviceId) {
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }
  let constraints = {};
  if (deviceId) {
    constraints = { video: { deviceId: { exact: deviceId } } };
  } else {
    constraints = { video: { facingMode: { ideal: "environment" } } };
  }
  try {
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
  } catch (err) {
    alert("Cannot access camera. Try a different browser.");
    console.error(err);
  }
}

// Start camera button
startBtn.onclick = async () => {
  await getCameras();
  if (devices.length === 0) {
    alert("No cameras found.");
    return;
  }
  currentIndex = 0;
  startCamera(devices[currentIndex]?.deviceId);
};

// Toggle camera button
toggleBtn.onclick = () => {
  if (devices.length < 2) return;
  currentIndex = (currentIndex + 1) % devices.length;
  startCamera(devices[currentIndex].deviceId);
};

// Snap photo with border and automatic download
snapBtn.onclick = () => {
  // Use video native resolution for sharpness
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");

  // Draw video
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // Draw the transparent border
  const borderImg = new Image();
  borderImg.src = 'Border%20Flyer.png'; // make sure this file is in your repo root
  borderImg.onload = () => {
    ctx.drawImage(borderImg, 0, 0, canvas.width, canvas.height);

    // Convert canvas to data URL
    const dataURL = canvas.toDataURL("image/png");

    // Automatic download
    const link = document.createElement('a');
    link.href = dataURL;
    link.download = `Zaimar_Photo_${Date.now()}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };
};
</script>

</body>
</html>
