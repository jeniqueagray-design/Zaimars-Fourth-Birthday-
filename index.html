<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zaimars Turns Four 🎉</title>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Comic Sans MS', Arial, sans-serif;
  background: url('Dinosaur%20and%20unicorn%20birthday%20party.png') no-repeat center center fixed;
  background-size: cover;
  text-align: center;
}

/* Fade background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.65);
  z-index: -1;
}

h1 {
  margin: 10px 0 5px;
  font-size: clamp(2.2rem, 5vw, 3.2rem);
  color: black;
}

p {
  font-size: 1.4em;
  margin-bottom: 10px;
  color: black;
}

/* BIG camera */
#camera-container {
  position: relative;
  width: 92vw;
  max-width: 900px;
  height: 70vh;
  margin: 10px auto;
  border-radius: 30px;
  overflow: hidden;
  background: black;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

#camera-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Border overlay */
#border-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 10;
}

/* Buttons */
button {
  margin: 8px;
  padding: 14px 26px;
  font-size: 18px;
  border-radius: 14px;
  cursor: pointer;
  background: linear-gradient(45deg, #ff69b4, #ffb6c1);
  border: none;
  color: white;
  font-weight: bold;
}

button:disabled {
  background: #999;
}

/* Links */
a {
  display: block;
  margin: 10px 0;
  font-size: 1.2em;
  color: black;
  text-decoration: underline;
}
</style>
</head>

<body>

<h1>🎉 Zaimars Turns Four 🎉</h1>
<p>Roar • Sparkle • Shine</p>

<div id="camera-container">
  <video id="video" autoplay playsinline></video>
  <img
    id="border-overlay"
    src="https://lbemcrfivrhbhseafrlc.supabase.co/storage/v1/object/public/Party%20Photos/Border%20Flyer.png"
    alt="Border"
  />
</div>

<button id="start">Start Camera</button>
<button id="toggle" disabled>Switch Camera</button>
<button id="snap" disabled>Take Photo</button>

<div id="latest-photo-link"></div>

<a
  id="view-gallery"
  href="YOUR_GOOGLE_DRIVE_LINK_HERE"
  target="_blank"
>
View Gallery
</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const supabase = window.supabase.createClient(
    "https://lbemcrfivrhbhseafrlc.supabase.co",
    "sb_publishable_ey_VaVfrz5YwZIxTHcHcaA_pSY5W8-R"
  );

  const video = document.getElementById("video");
  const startBtn = document.getElementById("start");
  const toggleBtn = document.getElementById("toggle");
  const snapBtn = document.getElementById("snap");
  const latestLinkDiv = document.getElementById("latest-photo-link");

  let devices = [];
  let currentIndex = 0;
  let stream = null;

  async function getCameras() {
    const all = await navigator.mediaDevices.enumerateDevices();
    devices = all.filter(d => d.kind === "videoinput");
    toggleBtn.disabled = devices.length < 2;
  }

  async function startCamera(deviceId) {
    if (stream) stream.getTracks().forEach(t => t.stop());

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        deviceId: deviceId ? { exact: deviceId } : undefined,
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    video.srcObject = stream;
    await video.play();
    snapBtn.disabled = false;
  }

  startBtn.onclick = async () => {
    await getCameras();
    currentIndex = 0;
    await startCamera(devices[currentIndex].deviceId);
  };

  toggleBtn.onclick = async () => {
    currentIndex = (currentIndex + 1) % devices.length;
    await startCamera(devices[currentIndex].deviceId);
  };

  snapBtn.onclick = async () => {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const border = document.getElementById("border-overlay");
    ctx.drawImage(border, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(async blob => {
      const fileName = `Zaimar_${Date.now()}.png`;

      const { error } = await supabase
        .storage
        .from("Party Photos")
        .upload(fileName, blob, {
          contentType: "image/png",
          upsert: true
        });

      if (error) {
        alert(error.message);
        return;
      }

      const { data } = supabase
        .storage
        .from("Party Photos")
        .getPublicUrl(fileName);

      latestLinkDiv.innerHTML = `
        <a href="${data.publicUrl}" target="_blank">
          View Last Uploaded Photo
        </a>
      `;

      alert("Photo uploaded! 🎉");
    }, "image/png");
  };
});
</script>

</body>
</html>
