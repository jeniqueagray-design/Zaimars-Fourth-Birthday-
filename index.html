<!DOCTYPE html>
<html>
<head>
  <title>Zaimars Turns Four 📸</title>
  <style>
    body {
      background: black;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    video {
      width: 90%;
      max-width: 400px;
      border-radius: 12px;
      margin-top: 20px;
    }
    button {
      margin-top: 15px;
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<h1>🎉 Zaimars Turns Four 🎉</h1>
<p>Scan • Snap • Smile</p>

<video id="video" autoplay></video>
<br>
<button id="start">Start Camera</button>

<script>
  const video = document.getElementById("video");
  const button = document.getElementById("start");

  button.onclick = () => {
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => video.srcObject = stream)
      .catch(() => alert("Camera access denied"));
  };
</script>

</body>
</html>
