<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zaimars Turns Four 🎉</title>

<style>
body {
  margin: 0;
  font-family: 'Comic Sans MS', Arial, sans-serif;
  background: url('Dinosaur%20and%20unicorn%20birthday%20party.png') no-repeat center center fixed;
  background-size: cover;
  text-align: center;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.65);
  z-index: -1;
}

h1, p {
  color: black;
}

#camera-container {
  position: relative;
  width: 92vw;
  max-width: 900px;
  height: 70vh;
  margin: 10px auto;
  border-radius: 30px;
  overflow: hidden;
  background: black;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#border-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

button {
  margin: 8px;
  padding: 14px 26px;
  font-size: 18px;
  border-radius: 14px;
  cursor: pointer;
  background: linear-gradient(45deg, #ff69b4, #ffb6c1);
  border: none;
  color: white;
  font-weight: bold;
}

button:disabled {
  background: #999;
}

a {
  display: block;
  margin: 10px;
  font-size: 1.2em;
  color: black;
}
</style>
</head>

<body>

<h1>🎉 Zaimars Turns Four 🎉</h1>
<p>Roar • Sparkle • Shine</p>

<div id="camera-container">
  <video id="video" playsinline></video>
  <img
    id="border-overlay"
    crossorigin="anonymous"
    src="https://lbemcrfivrhbhseafrlc.supabase.co/storage/v1/object/public/Party%20Photos/Border%20Flyer.png"
  />
</div>

<button id="start">Start Camera</button>
<button id="toggle" disabled>Switch Camera</button>
<button id="snap" disabled>Take Photo</button>

<div id="latest-photo-link"></div>

<a href="https://drive.google.com/drive/folders/1NVzPpcGULNBn3ytPbDzFAFmCUn28G1HQ?usp=drive_link" target="_blank">
View Gallery
</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const supabase = window.supabase.createClient(
    "https://lbemcrfivrhbhseafrlc.supabase.co",
    "sb_publishable_ey_VaVfrz5YwZIxTHcHcaA_pSY5W8-R"
  );

  const video = document.getElementById("video");
  const border = document.getElementById("border-overlay");
  const startBtn = document.getElementById("start");
  const toggleBtn = document.getElementById("toggle");
  const snapBtn = document.getElementById("snap");
  const latestLink = document.getElementById("latest-photo-link");

  let stream;
  let cameras = [];
  let camIndex = 0;

  async function startBaseCamera() {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;
    await video.play();

    await new Promise(r => video.onplaying = r);

    snapBtn.disabled = false;

    const devices = await navigator.mediaDevices.enumerateDevices();
    cameras = devices.filter(d => d.kind === "videoinput");
    toggleBtn.disabled = cameras.length < 2;
  }

  async function switchCamera() {
    camIndex = (camIndex + 1) % cameras.length;
    if (stream) stream.getTracks().forEach(t => t.stop());

    stream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: { exact: cameras[camIndex].deviceId } }
    });

    video.srcObject = stream;
    await video.play();
  }

  startBtn.onclick = startBaseCamera;
  toggleBtn.onclick = switchCamera;

  snapBtn.onclick = () => {
    if (video.videoWidth === 0) return alert("Camera not ready");

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);
    ctx.drawImage(border, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(async blob => {
      const fileName = `Zaimar_${Date.now()}.png`;

      const { error } = await supabase
        .storage
        .from("Party Photos")
        .upload(fileName, blob, {
          contentType: "image/png",
          upsert: true
        });

      if (error) {
        alert(error.message);
        return;
      }

      const { data } = supabase
        .storage
        .from("Party Photos")
        .getPublicUrl(fileName);

      latestLink.innerHTML = `<a href="${data.publicUrl}" target="_blank">View Last Uploaded Photo</a>`;
      alert("Photo uploaded! 🎉");
    });
  };
});
</script>

</body>
</html>
