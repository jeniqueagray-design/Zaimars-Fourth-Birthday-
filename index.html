<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zaimars Turns Four 🎉</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Comic Sans MS', Arial, sans-serif;
    background: url('Dinosaur%20and%20unicorn%20birthday%20party.png') no-repeat center center fixed;
    background-size: cover;
    text-align: center;
  }

  h1 {
    margin-top: 20px;
    font-size: 3em;
    text-shadow: 2px 2px 5px #000;
  }

  p {
    font-size: 1.5em;
    color: black; /* tagline in black */
    text-shadow: 1px 1px 0 #fff; /* subtle white shadow for readability */
  }

  #camera-container {
    position: relative;
    display: inline-block;
    margin-top: 20px;
    width: 340px;
    height: 260px;
    border: 10px solid;
    border-image: linear-gradient(45deg, yellow, green) 1;
    border-radius: 25px;
    box-shadow: 0 0 20px #ffeb3b, 0 0 40px #32cd32 inset;
    overflow: hidden;
    background: rgba(255,255,255,0.1);
  }

  /* Border text */
  #camera-container::before {
    content: "Zaimars Turns 4";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.8em;
    font-weight: bold;
    color: #ff69b4;
    text-shadow: 2px 2px 3px #000;
    background-color: rgba(255, 255, 255, 0.2);
    padding: 5px 12px;
    border-radius: 12px;
    z-index: 2; /* above video */
  }

  /* Video feed */
  #camera-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    position: relative;
    z-index: 1; /* below text & characters */
  }

  /* Cartoon characters */
  #unicorn {
    position: absolute;
    bottom: 5px;
    left: 5px;
    width: 60px;
    height: 60px;
    pointer-events: none;
    z-index: 2;
  }

  #dino {
    position: absolute;
    bottom: 5px;
    right: 5px;
    width: 60px;
    height: 60px;
    pointer-events: none;
    z-index: 2;
  }

  button {
    margin: 10px;
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(45deg, #ff69b4, #ffb6c1);
    border: none;
    color: white;
    font-weight: bold;
    box-shadow: 2px 2px 5px #000;
    transition: transform 0.1s ease;
  }

  button:hover {
    transform: scale(1.05);
  }

  button:disabled {
    background-color: #888;
    cursor: not-allowed;
  }

</style>
</head>
<body>

<h1>🎉 Zaimars Turns Four 🎉</h1>
<p>Roar • Sparkle • Shine</p>

<div id="camera-container">
  <video id="video" autoplay playsinline></video>

  <!-- Unicorn SVG -->
  <svg id="unicorn" viewBox="0 0 64 64">
    <path fill="#fff" stroke="#000" stroke-width="2" d="M16 48 Q14 36 24 28 Q32 24 36 32 Q40 40 32 48 Z" />
    <path fill="#f5a9f2" d="M24 28 L28 20 L32 28 Z" />
  </svg>

  <!-- Dino SVG -->
  <svg id="dino" viewBox="0 0 64 64">
    <path fill="#32cd32" stroke="#000" stroke-width="2" d="M8 48 Q16 36 32 40 Q48 44 40 52 Q32 60 16 56 Z" />
    <circle cx="32" cy="42" r="2" fill="#000" />
  </svg>

</div>

<br>
<button id="start">Start Camera</button>
<button id="toggle" disabled>Switch Camera</button>
<button id="snap">Take Photo</button>

<script>
const video = document.getElementById("video");
const startBtn = document.getElementById("start");
const toggleBtn = document.getElementById("toggle");
const snapBtn = document.getElementById("snap");

let currentStream = null;
let devices = [];
let currentIndex = 0;

// Get all cameras
async function getCameras() {
  const allDevices = await navigator.mediaDevices.enumerateDevices();
  devices = allDevices.filter(d => d.kind === "videoinput");
  if (devices.length > 1) toggleBtn.disabled = false;
}

// Start camera by deviceId or fallback
async function startCamera(deviceId) {
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }
  let constraints = {};
  if (deviceId) {
    constraints = { video: { deviceId: { exact: deviceId } } };
  } else {
    constraints = { video: { facingMode: { ideal: "environment" } } };
  }
  try {
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
    console.log("Camera started");
  } catch (err) {
    alert("Cannot access camera. Try a different browser.");
    console.error("Camera error:", err);
  }
}

// Start camera
startBtn.onclick = async () => {
  await getCameras();
  if (devices.length === 0) {
    alert("No cameras found.");
    return;
  }
  currentIndex = 0;
  startCamera(devices[currentIndex]?.deviceId);
};

// Toggle camera
toggleBtn.onclick = () => {
  if (devices.length < 2) return;
  currentIndex = (currentIndex + 1) % devices.length;
  startCamera(devices[currentIndex].deviceId);
};

// Snap photo with border, text, and cartoon characters
snapBtn.onclick = () => {
  const container = document.getElementById("camera-container");
  const canvas = document.createElement("canvas");
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  const ctx = canvas.getContext("2d");

  // Draw video
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // Draw gradient border
  const gradient = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  gradient.addColorStop(0,"yellow");
  gradient.addColorStop(1,"green");
  ctx.lineWidth = 20;
  ctx.strokeStyle = gradient;
  ctx.strokeRect(0,0,canvas.width,canvas.height);

  // Draw text
  ctx.font = "bold 24px Comic Sans MS";
  ctx.fillStyle = "#ff69b4";
  ctx.textAlign = "center";
  ctx.fillText("Zaimars Turns 4", canvas.width/2, 30);

  // Draw simple unicorn (bottom-left)
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.ellipse(30, canvas.height-30, 15, 20, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#f5a9f2";
  ctx.beginPath();
  ctx.moveTo(30, canvas.height-50);
  ctx.lineTo(33, canvas.height-30);
  ctx.lineTo(27, canvas.height-30);
  ctx.closePath();
  ctx.fill();

  // Draw simple dino (bottom-right)
  ctx.fillStyle = "#32cd32";
  ctx.beginPath();
  ctx.ellipse(canvas.width-30, canvas.height-30, 15, 20, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.arc(canvas.width-30, canvas.height-32, 2, 0, Math.PI*2);
  ctx.fill();

  // Open photo in new tab
  const dataURL = canvas.toDataURL("image/png");
  const win = window.open();
  win.document.write(`<img src="${dataURL}" width="100%">`);
};
</script>

</body>
</html>
