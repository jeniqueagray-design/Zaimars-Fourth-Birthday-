<head>

  <title>Zaimars Turns Four 🎉</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', Arial, sans-serif;

      background-size: cover;

    button:hover {

    }

    button:disabled {

  </style>
</head>
